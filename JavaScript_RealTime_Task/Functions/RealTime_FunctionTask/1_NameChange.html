<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Object</title>
</head>
<body>
    <div>
        <h1 id="name"> Hello  Js </h1>
        <button onclick="changes()"> click here ! </button>

    </div>

    <script>
        const changes = () =>{
            document.getElementById("name").innerText="RAGHUL"
        }
    </script>
</body>
</html>
