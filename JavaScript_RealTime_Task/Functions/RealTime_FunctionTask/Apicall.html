<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API call in the App</title>
</head>

<body>
    <div>

        <h3>Fetch API with Callback (Simple)</h3>
        <button onclick="getData()">Get Users</button>
        <div id="output"></div>

    </div>
    <script>
        // 1️⃣ Function that gets data and uses a callback
        function fetchData(callback) {
            fetch("https://jsonplaceholder.typicode.com/users")
                .then(res => res.json())       // convert response to JSON
                .then(data => callback(data));  // call callback with the data
        }

        // 2️⃣ Function to show data (callback)
        function showUsers(users) {
            let html = "";
            users.forEach(u => {
                html += `<p>${u.name} - ${u.email}</p>`;
            });
            document.getElementById("output").innerHTML = html;
        }

        // 3️⃣ Button click: call fetchData and pass showUsers as callback
        function getData() {
            fetchData(showUsers);
        }
    </script>
</body>

</html>
