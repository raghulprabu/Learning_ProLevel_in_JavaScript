<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Call Back Function</title>
</head>
<body>
    <div>
        <h1> task 1 call back Function </h1>

        <button onclick="mainTask()">  😀 clicked  button </button>
    </div>
    <script>

      const sayHello = () =>{
        alert("  👋 say hello ")
      }

      const mainTask  = () =>{
          console.log("Button clicked!");
        setTimeout(sayHello,1000)

      }

    </script>
</body>
</html>
