<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Task</title>
</head>
<body>
    <div>
        <input type="text" id="value" placeholder="enter your Name">
        <button onclick="show()"> click now 🥰</button>
        <h1 id="result"></h1>

    </div>

    <script>

        function show() {

            const Names = document.getElementById('value').value
            document.getElementById('result').innerHTML = "Hello" + Names
            
        }

    </script>
</body>
</html>
