<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h2 id="clock"></h2>
    </div>

    <script>
        setInterval(() => {
         const now = new Date();
         document.getElementById("clock").innerText = now.toLocaleTimeString();
       }, 1000);
    </script>

    
</body>
</html>
