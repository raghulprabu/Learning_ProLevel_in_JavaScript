<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <input id="num1" placeholder="Enter number 1">
        <input id="num2" placeholder="Enter number 2">
        <br><br>

        <button onclick="addNumbers()">Add</button>
        <button onclick="subtractNumbers()">Subtract</button>

        <h1 id="result"></h1>

    </div>
    <script>
        //!  An object method is a function stored inside an object.
        const calculator = {
            add(a, b) {
                return a + b;
            },
            subtract(a, b) {
                return a - b;
            }
        };

        function addNumbers() {
            const a = Number(document.getElementById("num1").value);
            const b = Number(document.getElementById("num2").value);
            document.getElementById("result").innerText = "Result: " + calculator.add(a, b);
        }

        function subtractNumbers() {
            const a = Number(document.getElementById("num1").value);
            const b = Number(document.getElementById("num2").value);
            document.getElementById("result").innerText = "Result: " + calculator.subtract(a, b);
        }
    </script>
</body>
</html>
