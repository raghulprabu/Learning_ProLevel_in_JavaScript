<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>

        <h1>OBJECTS (Key–Value Collections)</h1>

        <button onclick="showStudent()">Show Student Info</button>
        <h1 id="info"></h1>

    </div>


    <script>
        const student = {
            name: "Raghul",
            department: "CSE",
            mark: 92
        };

        function showStudent() {
            document.getElementById("info").innerText =
                `Name: ${student.name}, Dept: ${student.department}, Mark: ${student.mark}`;
        }
    </script>

</body>

</html>
