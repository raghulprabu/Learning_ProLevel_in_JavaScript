<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 4. EVENT OBJECT</title>
</head>

<body>
    <div>

        <h1 id="keyInfo">Press any key</h1>


    </div>

    <script>
        document.addEventListener("keydown", function (e) {
            document.getElementById("keyInfo").innerText = "You pressed: " + e.key;
        });
    </script>

</body>

</html>
