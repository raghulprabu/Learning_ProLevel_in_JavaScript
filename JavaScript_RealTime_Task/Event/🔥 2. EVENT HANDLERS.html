<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 2. EVENT HANDLERS</title>
</head>

<body>
    <div>
        <h1>🔥 2. EVENT HANDLERS</h1>

        <input id="name" placeholder="Type here">
        <h1 id="result"></h1>
    </div>
    <script>
        document.getElementById("name").onkeyup = function () {
            document.getElementById("result").innerText = this.value;
        };
    </script>

</body>

</html>
